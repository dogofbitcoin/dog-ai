# Nginx server block for Dog of Bitcoin.
# Serves the built frontend bundle and proxies API calls to the backend.
# Drop this in /etc/nginx/sites-available/ and symlink to sites-enabled/.

server {
    listen 80;
    server_name dogofbitcoin.com www.dogofbitcoin.com;

    root /home/ubuntu/dog-of-bitcoin/frontend/dist;
    index index.html;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Static asset caching
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
